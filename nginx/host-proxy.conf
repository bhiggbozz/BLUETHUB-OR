# VPS host nginx (NOT used inside any container).
# Install on the server, e.g. /etc/nginx/sites-available/bluethub, then enable it.
# Routes each domain to the container port published by docker-compose.yml:
#   bluethub.com   -> landing container on 127.0.0.1:3001
#   bluetsch.com   -> web container     on 127.0.0.1:3010

server {
    listen 80;
    server_name bluethub.com www.bluethub.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name bluetsch.com *.bluetsch.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}