<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluethub · Software for schools, finance and growing brands</title>
    <meta name="description" content="Bluethub designs, builds and runs software for schools, financial services and growing brands. We are the team behind Skoolhub, QueensMoni, SABI and Cerebre Plus." />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <!-- [CONFIRM] canonical origin -->
    <link rel="canonical" href="https://bluethub.com/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bluethub" />
    <meta property="og:title" content="Bluethub · Software for schools, finance and growing brands" />
    <meta property="og:description" content="We design, build and run software that real organisations rely on. The team behind Skoolhub, QueensMoni, SABI and Cerebre Plus." />
    <meta property="og:url" content="https://bluethub.com/" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bluethub · Software for schools, finance and growing brands" />
    <meta name="twitter:description" content="We design, build and run software that real organisations rely on." />
    <!-- [CONFIRM] Add a 1200x630 image at public/og-image.png, then enable these two tags:
    <meta property="og:image" content="https://bluethub.com/og-image.png" />
    <meta name="twitter:image" content="https://bluethub.com/og-image.png" />
    -->
    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem("bluetthub-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
